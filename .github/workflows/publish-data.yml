name: "Publish data files to R2 (new folder only, statetrack/)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Upload (never deletes, never touches other folders)
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$(printf %s "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf %s "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
          acct="$(printf %s "$R2_ACCOUNT_ID" | tr -d '[:space:]')"; bucket="$(printf %s "$R2_BUCKET" | tr -d '[:space:]')"
          ep="https://$acct.r2.cloudflarestorage.com"
          aws s3 sync data/ca "s3://$bucket/statetrack/ca/" --endpoint-url "$ep" --exclude "*.gz" --content-type application/json --cache-control "public, max-age=300"
          aws s3 sync data/ca "s3://$bucket/statetrack/ca/" --endpoint-url "$ep" --exclude "*" --include "*.gz" --content-type application/gzip --cache-control "public, max-age=300"
          aws s3 cp taxonomy/taxonomy.json "s3://$bucket/statetrack/taxonomy/taxonomy.json" --endpoint-url "$ep" --content-type application/json --cache-control "public, max-age=300"
          echo "--- now in statetrack/"
          aws s3 ls "s3://$bucket/statetrack/" --recursive --endpoint-url "$ep" | awk '{print $3, $4}'
