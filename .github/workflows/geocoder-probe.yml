name: "Probe the Census geocoder for state legislative districts"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Query the geocoder for a Capitol address in each state
        run: python3 scripts/geocoder_probe.py
