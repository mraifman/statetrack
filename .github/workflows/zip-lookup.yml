name: "Build the California ZIP-to-district lookup from Census overlap files"

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Download and build (otherwise only list what Census offers)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: List what the Census publishes for legislative districts and ZIPs
        run: |
          curl -sS -L -m 90 "https://www2.census.gov/geo/docs/maps-data/data/rel2020/cd-sld/" -o /tmp/cdsld.html || true
          echo "files mentioning sld or zcta:"; grep -o 'tab20_[a-z0-9_]*\.txt' /tmp/cdsld.html | sort -u | grep -i -E 'sld|zcta' | head -60 || true
          echo "California (st06) files:"; grep -o 'tab20_[a-z0-9_]*st06\.txt' /tmp/cdsld.html | sort -u | head -60 || true
          echo "distinct prefixes:"; grep -o 'tab20_[a-z0-9]*_[a-z0-9]*' /tmp/cdsld.html | sort -u | head -60 || true
          echo "== block assignment files"; curl -sS -L -m 60 "https://www2.census.gov/geo/docs/maps-data/data/baf2020/" | grep -o 'BlockAssign_ST06[A-Za-z0-9_.]*' | sort -u || true
      - name: Download the overlap files
        if: ${{ inputs.build }}
        run: |
          mkdir -p /tmp/rel
          for chamber in sldl sldu; do
            ok=""
            for yr in 22 24 18; do
              f="tab20_zcta520_${chamber}${yr}_natl.txt"
              code=$(curl -sS -L -m 180 -o "/tmp/rel/$chamber.txt" -w "%{http_code}" "https://www2.census.gov/geo/docs/maps-data/data/rel2020/zcta520/$f" || true)
              echo "$f -> $code"
              if [ "$code" = "200" ]; then ok="$f"; break; fi
            done
            [ -n "$ok" ] || { echo "no $chamber file found"; exit 1; }
            echo "$chamber: $ok, $(wc -l < /tmp/rel/$chamber.txt) lines"; head -2 "/tmp/rel/$chamber.txt" | cut -c1-400
          done
      - name: Build the lookup
        if: ${{ inputs.build }}
        run: python3 scripts/build_zip_lookup.py /tmp/rel/sldl.txt /tmp/rel/sldu.txt data/ca/zip_lookup.json
      - name: Commit
        if: ${{ inputs.build }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ca/zip_lookup.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "California ZIP to legislative district lookup (Census overlap files)"
          git pull -q --rebase origin main && git push -q origin main
